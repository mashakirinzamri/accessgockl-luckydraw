  let state = {entries: [], winners: [], sound: true};
  let selectedPrizeIdx = -1;
  let spinning = false;

  /* ---------- Storage ---------- */
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if(s && Array.isArray(s.entries)){
        state.entries = s.entries.filter(x => typeof x === 'string');
        state.winners = Array.isArray(s.winners) ? s.winners : [];
        state.sound = s.sound !== false;
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  /* ---------- Draw model ---------- */
  function drawnKeys(){ return new Set(state.winners.map(w => key(w.name))); }
  function pool(){
    const d = drawnKeys();
    return state.entries.filter(n => !d.has(key(n)));
  }
  function remaining(i){
    return PRIZES[i].qty - state.winners.filter(w => w.prizeIdx === i).length;
  }
  function firstAvailablePrize(){
    for(let i = 0; i < PRIZES.length; i++) if(remaining(i) > 0) return i;
    return -1;
  }
  function fmtTime(iso){
    try{
      return new Date(iso).toLocaleString('en-GB', {timeZone:'Asia/Kuala_Lumpur', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'});
    }catch(e){ return iso; }
  }

  /* ---------- Entries ---------- */
  function addNames(list, allowDup){
    const existing = new Set(state.entries.map(key));
    let added = 0, dup = 0;
    list.forEach(raw => {
      const n = String(raw).trim().replace(/\s+/g, ' ').slice(0, 80);
      if(!n) return;
      if(!allowDup && existing.has(key(n))){ dup++; return; }
      existing.add(key(n));
      state.entries.push(n);
      added++;
    });
    if(added || dup){
      save(); refreshIdle(); render();
      toast('Added ' + added + ' name' + (added === 1 ? '' : 's') + (dup ? ', ' + dup + ' duplicate' + (dup === 1 ? '' : 's') + ' skipped' : ''));
    }
    return added;
  }
  function removeEntryAt(i){
    state.entries.splice(i, 1);
    save(); refreshIdle(); render();
  }

  /* ---------- Rendering ---------- */
  function render(){
    const p = pool();
    const total = state.entries.length;
    $('statTotal').textContent = total;
    $('statPool').textContent = p.length;
    $('statDrawn').textContent = total - p.length;
    $('poolNote').textContent = p.length + ' name' + (p.length === 1 ? '' : 's') + ' on the wheel';

    renderEntries();
    renderPrizes();
    renderWinners();
    renderNow();
    updateSpinBtn();
  }

  function renderEntries(){
    const q = $('search').value.trim().toLowerCase();
    const d = drawnKeys();
    let html = '';
    state.entries.forEach((n, i) => {
      if(q && !n.toLowerCase().includes(q)) return;
      const isD = d.has(key(n));
      html += '<li class="' + (isD ? 'drawn' : '') + '"><span class="n">' + esc(n) + '</span>' +
              '<span>' + (isD ? '<span class="tag-drawn">Drawn</span>' : '') +
              '<button class="x" data-i="' + i + '" title="Remove entry" aria-label="Remove ' + esc(n) + '">&times;</button></span></li>';
    });
    if(!html) html = '<li class="empty">' + (state.entries.length ? 'No matches' : 'No entries yet. Add names to begin.') + '</li>';
    $('entryList').innerHTML = html;
  }

  function renderPrizes(){
    let html = '';
    TIER_ORDER.forEach(tier => {
      const idxs = PRIZES.map((p, i) => i).filter(i => PRIZES[i].tier === tier);
      if(!idxs.length) return;
      html += '<div class="group-title">' + tier + '</div>';
      idxs.forEach(i => {
        const p = PRIZES[i];
        const rem = remaining(i);
        const cls = ['prize', i === selectedPrizeIdx ? 'active' : '', rem <= 0 ? 'done' : ''].join(' ').replace(/\s+/g, ' ');
        html += '<div class="' + cls + '" data-i="' + i + '" role="button" tabindex="0">' +
                '<div><div class="prize-name">' + esc(p.name) + '</div>' +
                '<div class="prize-meta">' + rem + ' of ' + p.qty + ' left</div></div>' +
                '<span class="tier ' + TIER_CLS[tier] + '">x' + p.qty + '</span></div>';
      });
    });
    $('prizeList').innerHTML = html;
    $('prizeSummary').textContent = state.winners.length + ' / ' + TOTAL_PRIZES + ' awarded';
  }

  function renderWinners(){
    const tb = $('winTable');
    if(!state.winners.length){
      tb.innerHTML = '<tr><td colspan="5" class="empty">No winners yet</td></tr>';
      return;
    }
    tb.innerHTML = state.winners.map((w, i) => {
      const p = PRIZES[w.prizeIdx];
      return '<tr><td>' + (i + 1) + '</td><td>' + esc(p.name) + '</td>' +
             '<td><span class="tier ' + TIER_CLS[p.tier] + '">' + p.tier + '</span></td>' +
             '<td><b>' + esc(w.name) + '</b></td><td>' + fmtTime(w.time) + '</td></tr>';
    }).reverse().join('');
  }

  function renderNow(){
    const el = $('nowPrize');
    if(selectedPrizeIdx < 0){
      el.textContent = pool().length || state.entries.length ? 'All prizes have been drawn' : 'Add entries to begin';
      return;
    }
    const p = PRIZES[selectedPrizeIdx];
    el.innerHTML = esc(p.name) + ' <span class="tier ' + TIER_CLS[p.tier] + '">' + p.tier + '</span>' +
                   '<span class="secondary small">(' + remaining(selectedPrizeIdx) + ' left)</span>';
  }

  function updateSpinBtn(){
    const can = !spinning && selectedPrizeIdx >= 0 && remaining(selectedPrizeIdx) > 0 && pool().length > 0;
    $('spinBtn').disabled = !can;
    $('spinBtn').textContent = spinning ? 'Spinning...' : 'Spin';
  }

  /* ---------- Wheel ---------- */
  function renderStrip(items){
    $('strip').innerHTML = items.map(n => '<div class="item">' + esc(n) + '</div>').join('');
    $('strip').style.transform = 'translateY(' + CENTER + 'px)';
  }
  function idleStrip(){
    const p = pool();
    $('window').classList.remove('won', 'spinning');
    if(!p.length){
      renderStrip([state.entries.length ? 'No names left in the draw' : 'Add names to begin']);
      return;
    }
    const items = [];
    for(let i = 0; i < 12; i++) items.push(p[Math.floor(Math.random() * p.length)]);
    renderStrip(items);
  }
  function refreshIdle(){ if(!spinning) idleStrip(); }

  function spin(){
    if(spinning) return;
    if(selectedPrizeIdx < 0 || remaining(selectedPrizeIdx) <= 0){
      selectedPrizeIdx = firstAvailablePrize();
      render();
    }
    if(selectedPrizeIdx < 0){ toast('All prizes have been drawn. Use Reset draw to start again.'); return; }
    const p = pool();
    if(!p.length){ toast('No names left in the draw. Add entries or reset the draw.'); return; }

    const prizeIdx = selectedPrizeIdx;
    const winnerName = p[Math.floor(Math.random() * p.length)];
    const N = 64, TARGET = N - 6;
    const items = [];
    for(let i = 0; i < N; i++) items.push(p[Math.floor(Math.random() * p.length)]);
    items[TARGET] = winnerName;
    renderStrip(items);

    const win = $('window');
    win.classList.remove('won');
    win.classList.add('spinning');
    spinning = true;
    updateSpinBtn();

    const dur = 5200 + Math.random() * 800;
    const t0 = performance.now();
    let lastCell = 0, lastTick = 0;

    function frame(now){
      const t = Math.min(1, (now - t0) / dur);
      const pos = (1 - Math.pow(1 - t, 4)) * TARGET;
      $('strip').style.transform = 'translateY(' + (CENTER - pos * ROW) + 'px)';
      const cell = Math.floor(pos);
      if(cell !== lastCell){
        lastCell = cell;
        if(now - lastTick > 60 && t < 1){ lastTick = now; tick(); }
      }
      if(t < 1) requestAnimationFrame(frame);
      else finishSpin(winnerName, prizeIdx, TARGET);
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(name, prizeIdx, target){
    spinning = false;
    const win = $('window');
    win.classList.remove('spinning');
    win.classList.add('won');
    const node = $('strip').children[target];
    if(node) node.classList.add('target');

    state.winners.push({name: name, prizeIdx: prizeIdx, time: new Date().toISOString()});
    if(remaining(prizeIdx) <= 0) selectedPrizeIdx = firstAvailablePrize();
    save();
    render();
    celebrate();
    fanfare();
    showWinner(name, prizeIdx);
  }

  /* ---------- Winner modal ---------- */
  function showWinner(name, prizeIdx){
    const p = PRIZES[prizeIdx];
    $('wName').textContent = name;
    $('wPrize').textContent = p.name;
    $('wTier').textContent = p.tier;
    $('wTier').className = 'tier ' + TIER_CLS[p.tier];
    $('overlay').hidden = false;
    $('closeWin').focus();
  }
  function closeWin(){ $('overlay').hidden = true; }

  /* ---------- Celebration: confetti ---------- */
  const cv = $('confetti'), ctx = cv.getContext('2d');
  let parts = [], animId = null;
  function resizeCanvas(){ cv.width = innerWidth; cv.height = innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function burst(x, y, count){
    for(let i = 0; i < count; i++){
      parts.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 16 - 4,
        g: 0.35,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        w: 6 + Math.random() * 6,
        h: 10 + Math.random() * 6,
        c: CONFETTI_COLOURS[Math.floor(Math.random() * CONFETTI_COLOURS.length)],
        life: 0,
        ttl: 180 + Math.random() * 120
      });
    }
    if(!animId) animId = requestAnimationFrame(tick2);
  }
  function tick2(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life < p.ttl && p.y < cv.height + 40);
    for(const p of parts){
      p.vy += p.g; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.ttl);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if(parts.length) animId = requestAnimationFrame(tick2);
    else { animId = null; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  function celebrate(){
    const t0 = performance.now();
    burst(innerWidth * 0.15, innerHeight * 0.95, 140);
    burst(innerWidth * 0.85, innerHeight * 0.95, 140);
    const timer = setInterval(() => {
      if(performance.now() - t0 > 2600){ clearInterval(timer); return; }
      burst(Math.random() * innerWidth, innerHeight * 0.25, 28);
    }, 350);
  }

  /* ---------- Sound (optional, Web Audio) ---------- */
  let actx = null;
  function tone(freq, start, dur, type, vol){
    if(!state.sound) return;
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + start;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'triangle';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }catch(e){}
  }
  function tick(){ tone(1800, 0, 0.03, 'square', 0.03); }
  function fanfare(){
    [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.4, 'triangle', 0.15));
    tone(1047, 0.5, 0.9, 'triangle', 0.12);
  }

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ---------- Two-click confirm for destructive actions ---------- */
  function armed(btn, action){
    if(!btn.dataset.label) btn.dataset.label = btn.textContent;
    if(btn.dataset.armed){
      clearTimeout(btn._t);
      btn.dataset.armed = '';
      btn.textContent = btn.dataset.label;
      action();
      return;
    }
    btn.dataset.armed = '1';
    btn.textContent = 'Click again to confirm';
    btn._t = setTimeout(() => { btn.dataset.armed = ''; btn.textContent = btn.dataset.label; }, 3000);
  }

  function resetDraw(){
    state.winners = [];
    selectedPrizeIdx = firstAvailablePrize();
    save(); refreshIdle(); render();
    toast('Draw reset. All names and prizes are restored.');
  }
  function clearAll(){
    state.entries = []; state.winners = [];
    selectedPrizeIdx = firstAvailablePrize();
    save(); refreshIdle(); render();
    toast('All entries and winners cleared.');
  }
  function loadAttendees(){
    state.entries = ATTENDEES.slice(); state.winners = [];
    selectedPrizeIdx = firstAvailablePrize();
    save(); refreshIdle(); render();
    toast('Restored ' + ATTENDEES.length + ' registered attendees.');
  }

  /* ---------- Events ---------- */
  $('addBtn').addEventListener('click', () => {
    const v = $('nameInput').value;
    if(!v.trim()){ toast('Type a name first.'); return; }
    addNames([v], true);
    $('nameInput').value = '';
    $('nameInput').focus();
  });
  $('nameInput').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('addBtn').click(); } });
  $('bulkBtn').addEventListener('click', () => {
    const text = $('bulk').value;
    if(!text.trim()){ toast('Paste some names first.'); return; }
    addNames(text.split(/\r?\n/));
    $('bulk').value = '';
  });
  $('search').addEventListener('input', renderEntries);
  $('entryList').addEventListener('click', e => {
    const b = e.target.closest('.x');
    if(b) removeEntryAt(+b.dataset.i);
  });
  $('prizeList').addEventListener('click', e => {
    const el = e.target.closest('.prize');
    if(!el || spinning) return;
    const i = +el.dataset.i;
    if(remaining(i) <= 0){ toast('All of this prize has been drawn.'); return; }
    selectedPrizeIdx = i;
    render();
  });
  $('prizeList').addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.classList.contains('prize')) e.target.click();
  });
  $('spinBtn').addEventListener('click', spin);
  $('resetBtn').addEventListener('click', e => { if(!spinning) armed(e.currentTarget, resetDraw); });
  $('clearBtn').addEventListener('click', e => {
    if(!state.entries.length){ toast('There are no entries to clear.'); return; }
    armed(e.currentTarget, clearAll);
  });
  $('reloadBtn').addEventListener('click', e => armed(e.currentTarget, loadAttendees));
  $('csvBtn').addEventListener('click', () => {
    if(!state.winners.length){ toast('No winners to export yet.'); return; }
    const rows = [['#', 'Prize', 'Tier', 'Winner', 'Drawn at (MYT)']];
    state.winners.forEach((w, i) => {
      const p = PRIZES[w.prizeIdx];
      rows.push([i + 1, p.name, p.tier, w.name, fmtTime(w.time)]);
    });
    const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'}));
    a.download = 'lucky-draw-winners.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
  $('closeWin').addEventListener('click', closeWin);
  $('overlay').addEventListener('click', e => { if(e.target === $('overlay')) closeWin(); });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && !$('overlay').hidden){ closeWin(); return; }
    if(e.code !== 'Space' || !$('overlay').hidden) return;
    const t = e.target;
    if(t.matches && t.matches('input,textarea,select,[contenteditable]')) return;
    if(t.tagName === 'BUTTON' && t.id !== 'spinBtn') return;
    e.preventDefault();
    spin();
  });

  /* ---------- Init ---------- */
  load();
  if(!localStorage.getItem(KEY)) state.entries = ATTENDEES.slice();
  selectedPrizeIdx = firstAvailablePrize();
  render();
  idleStrip();
})();
</script>
