td{color:#F5FBFC !important;border-bottom:1px solid rgba(255,255,255,.07) !important}
thead{background:transparent !important}
tbody tr:hover{background:rgba(158,243,255,.06) !important}
.secondary,.label{color:#CFE8EC !important}
.card,.subtle-bg,.panel{background:rgba(6,36,46,.86) !important;color:#F5FBFC !important}
a{color:#9EF3FF !important}
blockquote,pre,code{background:rgba(0,0,0,.3) !important;color:#F5FBFC !important}
.btn{color:#9EF3FF !important;background-color:transparent}
.btn.primary{color:#1a0020 !important;background:linear-gradient(90deg,#ff2e88,#ff9a3c) !important}
.btn.danger{color:#FF9FCB !important}
.btn.ghost{color:#D7BBFF !important}
input,textarea{background:rgba(0,0,0,.3) !important;color:#F5FBFC !important}
</style>
