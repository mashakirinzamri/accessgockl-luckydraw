html,body{background:#0F4C5C !important;background-color:#0F4C5C !important;color:#F5FBFC !important;color-scheme:dark}
body{background-image:none !important}
h1,h2,h3,h4,h5,h6{color:#F5FBFC !important}
h2{color:#9EF3FF !important}
