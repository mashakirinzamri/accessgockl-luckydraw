name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Draw</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap');

:root{
  --pink:#ff2e88; --cyan:#22f0ff; --yellow:#ffd166; --orange:#ff9a3c; --violet:#b56cff; --txt-pink:#FF9FCB; --txt-violet:#D7BBFF; --txt-cyan:#9EF3FF; --txt-yellow:#FFE08A;
  --ink:#F5FBFC; --muted:#CFE8EC; --panel:rgba(6,36,46,.86); --line:rgba(158,243,255,.5);
}
*{box-sizing:border-box}
html{background:#0F4C5C;color-scheme:dark}
body{margin:0;min-height:100vh;color-scheme:dark;font-family:'Open Sans',sans-serif;color:var(--ink);font-size:15px;line-height:1.4;
  background:#0F4C5C;
  position:relative;overflow-x:hidden}
/* retro perspective grid floor */
body::before{content:"";position:fixed;left:-50%;right:-50%;bottom:-10%;height:55vh;pointer-events:none;z-index:0;opacity:.6;
  background-image:linear-gradient(rgba(34,240,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,46,136,.35) 1px,transparent 1px);
  background-size:60px 60px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 90%);mask-image:linear-gradient(to top,#000 10%,transparent 90%)}
/* scanlines */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,0) 4px);opacity:.5}

/* Hero */
.hero{position:relative;z-index:1;text-align:center;padding:26px 16px 6px}
.hero h1{font-family:'Orbitron',sans-serif;font-weight:800;font-size:46px;letter-spacing:.08em;margin:0;color:#fff;
  text-shadow:0 0 6px #fff,0 0 14px var(--pink),0 0 28px var(--pink),0 0 48px var(--pink)}
.hero .sub{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.3em;color:var(--txt-cyan);text-shadow:0 0 8px var(--cyan);margin-top:10px;text-transform:uppercase}

/* Layout */
.layout{position:relative;z-index:1;display:grid;grid-template-columns:330px minmax(420px,1fr) 360px;gap:20px;padding:20px 28px;max-width:1400px;margin:0 auto;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;
  box-shadow:0 0 0 1px rgba(255,46,136,.15) inset,0 0 22px rgba(34,240,255,.18),0 10px 40px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.winners-wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 28px 28px}
@media(max-width:1100px){.layout{grid-template-columns:1fr 1fr}.center{grid-column:1/-1;order:-1}}
@media(max-width:700px){.layout{grid-template-columns:1fr;padding:12px}.winners-wrap{padding:0 12px 12px}.hero h1{font-size:30px}}

h2{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;margin:0 0 4px;color:var(--txt-cyan);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 8px rgba(34,240,255,.6)}
.secondary{color:var(--muted)}
.small{font-size:13px}

/* Controls */
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:center}
.row.between{justify-content:space-between}
.row input{flex:1;min-width:0}
input,textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid rgba(34,240,255,.4);border-radius:8px;color:var(--ink);background:rgba(0,0,0,.3);width:100%;color-scheme:dark}
input::placeholder,textarea::placeholder{color:#8a7aa8}
input:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,240,255,.3),0 0 14px rgba(34,240,255,.4)}
textarea{resize:vertical}
.btn{font:inherit;font-weight:700;font-size:13px;letter-spacing:.04em;padding:9px 14px;border-radius:8px;border:1px solid var(--cyan);cursor:pointer;background:transparent;color:var(--cyan);
  text-shadow:0 0 6px rgba(34,240,255,.6);box-shadow:0 0 10px rgba(34,240,255,.25);transition:transform .1s,box-shadow .2s,background .2s}
.btn:hover:not(:disabled){box-shadow:0 0 18px rgba(34,240,255,.6);background:rgba(34,240,255,.08)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.primary{border-color:transparent;color:#1a0020;text-shadow:none;background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 0 16px rgba(255,46,136,.6)}
.btn.primary:hover:not(:disabled){background:linear-gradient(90deg,var(--orange),var(--pink));box-shadow:0 0 26px rgba(255,46,136,.9)}
.btn.danger{border-color:var(--pink);color:var(--txt-pink);text-shadow:0 0 6px rgba(255,46,136,.6);box-shadow:0 0 10px rgba(255,46,136,.25)}
.btn.danger:hover:not(:disabled){background:rgba(255,46,136,.1)}
.btn.ghost{border-color:var(--violet);color:var(--txt-violet);text-shadow:none;box-shadow:0 0 10px rgba(181,108,255,.25)}
.btn.big{width:100%;font-family:'Orbitron',sans-serif;font-size:18px;font-weight:800;padding:14px 20px;letter-spacing:.12em;text-transform:uppercase;margin-top:14px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
details textarea{margin-top:8px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.stats div{background:rgba(0,0,0,.2);border:1px solid rgba(255,46,136,.35);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font-family:'Orbitron',sans-serif;font-size:20px;color:var(--txt-yellow);text-shadow:0 0 8px rgba(255,209,102,.6)}
.stats span{font-size:12px;color:var(--muted)}

/* Entries list */
.list{list-style:none;margin:10px 0 0;padding:0;border:1px solid rgba(34,240,255,.3);border-radius:8px;max-height:320px;overflow:auto;background:rgba(0,0,0,.25)}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.list li:last-child{border-bottom:0}
.list li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li.drawn .n{color:#9FB8BE;text-decoration:line-through}
.list li.empty{justify-content:center;color:var(--muted)}
.tag-drawn{font-size:11px;background:rgba(255,46,136,.2);color:var(--txt-pink);padding:1px 7px;border-radius:999px;margin-right:4px;border:1px solid rgba(255,46,136,.5)}
.x{background:none;border:0;color:var(--txt-pink);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;text-shadow:0 0 6px rgba(255,46,136,.7)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px}

/* Wheel */
.center{text-align:center}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.window{position:relative;height:360px;overflow:hidden;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(158,243,255,.5);margin-top:12px;
  box-shadow:inset 0 0 40px rgba(255,46,136,.25),0 0 18px rgba(34,240,255,.25);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 78%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 78%,transparent 100%)}
.strip{position:absolute;top:0;left:0;right:0;will-change:transform}
.item{height:72px;display:flex;align-items:center;justify-content:center;padding:0 22px;font-size:22px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.target{color:#fff;font-weight:700;font-size:26px;text-shadow:0 0 8px var(--cyan),0 0 16px var(--cyan)}
.window.spinning .item{filter:blur(.7px);color:var(--muted)}
.focus{position:absolute;left:0;right:0;top:144px;height:72px;border-top:3px solid var(--pink);border-bottom:3px solid var(--pink);
  background:linear-gradient(90deg,rgba(255,46,136,0),rgba(255,46,136,.25),rgba(255,46,136,0));box-shadow:0 0 18px rgba(255,46,136,.6);pointer-events:none;z-index:2}
.window.won .focus{animation:pulse .7s ease-in-out 5}
@keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(255,46,136,.6)}50%{box-shadow:0 0 40px rgba(34,240,255,.9)}}
.now{margin:14px 0 0;background:rgba(0,0,0,.3);border:1px dashed rgba(255,224,138,.6);border-radius:10px;padding:12px}
.now .label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--txt-yellow);font-weight:700}
#nowPrize{font-weight:700;font-size:16px;color:#fff;margin-top:4px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

/* Tiers */
.tier{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block;color:#1a0020;letter-spacing:.03em}
.t-grand{background:var(--pink);color:#1a0020;box-shadow:0 0 12px rgba(255,46,136,.7)}
.t-gold{background:var(--yellow);box-shadow:0 0 10px rgba(255,209,102,.6)}
.t-silver{background:var(--cyan);box-shadow:0 0 10px rgba(34,240,255,.6)}
.t-bronze{background:var(--orange);box-shadow:0 0 10px rgba(255,154,60,.6)}

/* Prizes */
.group-title{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--txt-violet);margin:16px 0 6px;text-shadow:0 0 6px rgba(181,108,255,.7)}
.prize{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid rgba(158,243,255,.25);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:rgba(0,0,0,.18)}
.prize:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(34,240,255,.3)}
.prize.active{border:2px solid var(--pink);background:rgba(255,46,136,.12);padding:9px 11px;box-shadow:0 0 16px rgba(255,46,136,.45)}
.prize.done{opacity:.4;cursor:not-allowed}
.prize-name{font-weight:600;font-size:14px;color:#fff}
.prize-meta{font-size:12px;color:var(--muted);margin-top:2px}

/* Winners table */
.table-wrap{overflow:auto;margin-top:12px;border:1px solid rgba(34,240,255,.35);border-radius:8px;max-height:380px;background:rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:linear-gradient(90deg,#0A2E38,#14606F);color:#fff;text-align:left;font-family:'Orbitron',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px}
td{padding:8px 10px;border-top:1px solid rgba(255,255,255,.07);vertical-align:top;color:var(--ink)}
tr:nth-child(even) td{background:rgba(0,0,0,.14)}
td b{color:var(--txt-yellow)}
td .empty{padding:10px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(5,0,15,.82);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay[hidden]{display:none}
.modal{background:linear-gradient(160deg,#0A2E38,#0F4C5C);border:2px solid var(--pink);border-radius:16px;padding:32px 28px;max-width:460px;width:100%;text-align:center;
  box-shadow:0 0 40px rgba(255,46,136,.6),0 0 80px rgba(34,240,255,.25);animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.kicker{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-cyan);font-weight:700;text-shadow:0 0 8px var(--cyan)}
.winner{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:800;color:#fff;margin:12px 0 8px;word-break:break-word;line-height:1.2;
  text-shadow:0 0 6px #fff,0 0 16px var(--pink),0 0 30px var(--pink)}
.won-prize{font-size:17px;color:var(--txt-yellow);font-weight:600}
.modal .tier{margin-top:12px}
.modal .btn{margin-top:20px}

/* Confetti and toast */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#06242E;color:var(--ink);border:1px solid var(--cyan);box-shadow:0 0 16px rgba(34,240,255,.5);
  padding:12px 18px;border-radius:10px;font-size:14px;transition:transform .3s;z-index:150;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root, :host {
  /* Neutral */
  --neutral-00: #ffffff;
  --neutral-05: #f8f8f9;
  --neutral-10: #f4f5f7;
  --neutral-15: #eceff1;
  --neutral-20: #dadee3;
  --neutral-30: #b9bec4;
  --neutral-40: #999fa5;
  --neutral-50: #5e6469;
  --neutral-60: #43484e;
  --neutral-70: #2a2e33;
  --neutral-80: #1e2227;
  --neutral-90: #12171b;

  /* Teal (primary accent) */
  --teal-10: #e6f4f3;
  --teal-20: #bfe4e1;
  --teal-30: #8fd1cc;
  --teal-40: #5fbeb6;
  --teal-50: #2fab9f;
  --teal-60: #239187;
  --teal-70: #1a746c;

  /* Purple */
  --purple-10: #f2ecfb;
  --purple-20: #d6c8f4;
  --purple-30: #b79fec;
  --purple-40: #9875e4;
  --purple-50: #794cdc;
  --purple-60: #613bc2;
  --purple-70: #4b2c9c;

  /* Blue */
  --blue-10: #e8f1fd;
  --blue-20: #c3dafb;
  --blue-30: #9bc1f8;
  --blue-40: #73a8f5;
  --blue-50: #4b8ff2;
  --blue-60: #3576d0;
  --blue-70: #275ca4;

  /* Success */
  --success-10: #e6f6ec;
  --success-20: #c2e8cf;
  --success-30: #98d9b0;
  --success-40: #6dca91;
  --success-50: #42bb72;
  --success-60: #32995d;

  /* Warning */
  --warning-10: #fff5e5;
  --warning-20: #ffe3b8;
  --warning-30: #ffd08a;
  --warning-40: #ffbe5c;
  --warning-50: #ffab2e;
  --warning-60: #db8d24;

  /* Error */
  --error-10: #fdeaea;
  --error-20: #f8c6c6;
  --error-30: #f29f9f;
  --error-40: #ec7878;
  --error-50: #e65151;
  --error-60: #bf3e3e;

  /* Info */
  --info-10: #e8f1fd;
  --info-20: #c3dafb;
  --info-30: #9bc1f8;
  --info-40: #73a8f5;
  --info-50: #4b8ff2;
  --info-60: #3576d0;
}

/* ── Base reset & defaults ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 1rem;
  line-height: 1.5rem;
  font-weight: 400;
  color: var(--neutral-90);
  background: var(--neutral-00);
  padding: 2rem;
  max-width: 960px;
  margin: 0 auto;
}

/* ── Typography ─────────────────────────────────────────────────────── */
h1, h2, h3 { font-weight: 800; color: var(--neutral-90); margin-top: 2rem; margin-bottom: 1rem; }
h1 { font-size: 1.75rem; line-height: 1.3; }
h2 { font-size: 1.5rem; line-height: 1.35; }
h3 { font-size: 1.25rem; line-height: 1.4; }

h4, h5, h6 { font-weight: 600; color: var(--neutral-90); margin-top: 1.5rem; margin-bottom: 0.75rem; }
h4 { font-size: 1.25rem; }
h5 { font-size: 1.125rem; }
h6 { font-size: 1rem; }

p { margin-bottom: 1rem; }

small, .text-sm { font-size: 0.875rem; }

a { color: var(--teal-60); text-decoration: underline; }
a:hover { color: var(--teal-70); }

strong, b { font-weight: 600; }

/* ── Lists ──────────────────────────────────────────────────────────── */
ul, ol { padding-left: 1.5rem; margin-bottom: 1rem; }
li { margin-bottom: 0.25rem; }
li::marker { color: var(--neutral-40); }

/* ── Tables ─────────────────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.875rem; }
thead { background: var(--neutral-10); }
th { font-weight: 600; text-align: left; padding: 0.75rem 1rem; border-bottom: 2px solid var(--neutral-20); color: var(--neutral-70); }
td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--neutral-15); color: var(--neutral-90); }
tbody tr:hover { background: var(--neutral-05); }

/* ── Blockquote ─────────────────────────────────────────────────────── */
blockquote {
  border-left: 4px solid var(--teal-40);
  padding: 0.75rem 1rem;
  margin: 1rem 0;
  background: var(--neutral-05);
  color: var(--neutral-60);
}

/* ── Code ────────────────────────────────────────────────────────────── */
code {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 0.875em;
  background: var(--neutral-10);
  padding: 0.125rem 0.375rem;
  border-radius: 0.25rem;
}
pre {
  background: var(--neutral-10);
  padding: 1rem;
  border-radius: 0.5rem;
  overflow-x: auto;
  margin: 1rem 0;
}
pre code { background: none; padding: 0; }

/* ── Horizontal rule ────────────────────────────────────────────────── */
hr { border: none; border-top: 1px solid var(--neutral-20); margin: 2rem 0; }

/* ── Utility classes ────────────────────────────────────────────────── */
.label { font-weight: 600; color: var(--neutral-70); }
.secondary { color: var(--neutral-60); }
.accent { color: var(--teal-60); }
.accent-bg { background: var(--teal-10); }

.subtle-bg { background: var(--neutral-10); padding: 1rem; border-radius: 0.5rem; margin: 1rem 0; }
.card {
  background: var(--neutral-00);
  border: 1px solid var(--neutral-20);
  border-radius: 0.5rem;
  padding: 1.5rem;
  margin: 1rem 0;
}

/* Status badges */
.badge {
  display: inline-block;
  padding: 0.125rem 0.5rem;
  border-radius: 0.5rem;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-success { background: var(--success-10); color: var(--success-60); }
.badge-warning { background: var(--warning-10); color: var(--warning-60); }
.badge-error   { background: var(--error-10);   color: var(--error-60); }
.badge-info    { background: var(--info-10);    color: var(--info-60); }

/* Semantic alert boxes */
.alert {
  padding: 1rem;
  border-radius: 0.5rem;
  margin: 1rem 0;
  font-size: 0.875rem;
}
.alert-success { background: var(--success-10); border-left: 4px solid var(--success-50); color: var(--success-60); }
.alert-warning { background: var(--warning-10); border-left: 4px solid var(--warning-50); color: var(--warning-60); }
.alert-error   { background: var(--error-10);   border-left: 4px solid var(--error-50);   color: var(--error-60); }
.alert-info    { background: var(--info-10);    border-left: 4px solid var(--info-50);    color: var(--info-60); }

/* Grid helpers */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1rem 0; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 1rem 0; }

/* Metric / KPI card */
.metric { text-align: center; }
.metric-value { font-size: 2rem; font-weight: 800; color: var(--teal-60); }
.metric-label { font-size: 0.875rem; font-weight: 600; color: var(--neutral-60); }

/* ── Inter font import ──────────────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
</style></head>
<body>

<div class="hero"><h1>LUCKY DRAW</h1><div class="sub">Neon Night &middot; Live Draw</div></div>

<main class="layout">

  <!-- 1. Entries -->
  <section class="panel" aria-labelledby="entriesTitle">
    <h2 id="entriesTitle">1. Entries</h2>
    <p class="secondary small">Type a name and press Enter to add it, duplicates allowed. Pasted lists skip duplicates automatically.</p>
    <div class="row">
      <input id="nameInput" placeholder="Type a name and press Enter" maxlength="80" autocomplete="off">
      <button class="btn primary" id="addBtn">Add</button>
    </div>
    <details>
      <summary>Paste a list (one name per line)</summary>
      <textarea id="bulk" rows="6" placeholder="Ali Ahmad&#10;Siti Aminah&#10;Tan Wei Ming"></textarea>
      <div class="row"><button class="btn secondary" id="bulkBtn">Add all names</button></div>
    </details>

    <div class="stats">
      <div><b id="statTotal">0</b><span>Total entries</span></div>
      <div><b id="statPool">0</b><span>In the draw</span></div>
      <div><b id="statDrawn">0</b><span>Drawn</span></div>
    </div>

